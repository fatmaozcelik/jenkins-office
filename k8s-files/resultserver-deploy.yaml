apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: resultserver-deploy
  name: resultserver-deploy
spec:
  replicas: 1
  selector:
    matchLabels:
      app:  resultserver-deploy
  template:
    metadata:
      labels:
        app: resultserver-deploy
    spec:
      imagePullSecrets:
      - name: regcred
      containers:
      - image: 315974966113.dkr.ecr.us-east-1.amazonaws.com/phonebook-jo/result
        name: resultserver
        ports:
        - containerPort: 80
        envFrom:
          - secretRef:
              name: mysql-secret
          - configMapRef:
              name: server-config
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z mysql 3306; do
                echo "MySQL is not ready. Retrying in 2 seconds..."
                sleep 2
              done
              echo "MySQL is ready."
